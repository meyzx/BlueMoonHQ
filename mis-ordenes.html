<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Moon HQ - Registro de Adquisiciones</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Dancing+Script:wght@700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <style>
        :root {
            --bg-darkest: #0d0721; --bg-dark: #130934; --bg-card: #180b47;
            --primary-light: #4a21de; --accent-1-light: #b5de21;
            --text-muted: #96949e; --text-primary: #e5e4e7;
            --neon-blue: #00ccff; --neon-gold: #ffcc00;
        }

        body { 
            background-color: var(--bg-darkest); color: var(--text-primary); 
            font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh;
        }

        /* Scanline sutil */
        body::before {
            content: " "; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
            background-size: 100% 4px; z-index: 9999; pointer-events: none;
        }

        header {
            background: rgba(13, 7, 33, 0.9); backdrop-filter: blur(10px);
            padding: 15px 5%; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid var(--primary-light);
        }
        .logo { font-family: 'Dancing Script', cursive; font-size: 24px; text-decoration: none; color: white; }

        .main-content { padding: 60px 8%; max-width: 1000px; margin: 0 auto; }
        
        h1 { 
            font-family: 'JetBrains Mono'; font-size: 1.5rem; 
            letter-spacing: 2px; border-left: 4px solid var(--accent-1-light); 
            padding-left: 15px; margin-bottom: 40px; text-transform: uppercase;
        }

        /* TARJETA DE ORDEN TÁCTICA */
        .order-card {
            background: var(--bg-card); border: 1px solid rgba(181, 222, 33, 0.1);
            margin-bottom: 25px; padding: 25px; position: relative;
            clip-path: polygon(0 0, 98% 0, 100% 15%, 100% 100%, 2% 100%, 0 85%);
            transition: 0.3s;
        }
        .order-card:hover { border-color: var(--accent-1-light); transform: scale(1.01); }

        .order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .order-id { font-family: 'JetBrains Mono'; font-size: 11px; color: var(--accent-1-light); opacity: 0.8; }
        
        /* ESTADOS NEÓN */
        .status-pill {
            font-family: 'JetBrains Mono'; font-size: 10px; font-weight: bold;
            padding: 4px 12px; border-radius: 2px; text-transform: uppercase;
            border: 1px solid;
        }
        .status-pendiente { color: var(--neon-gold); border-color: var(--neon-gold); background: rgba(255,204,0,0.1); }
        .status-enviado { color: var(--neon-blue); border-color: var(--neon-blue); background: rgba(0,204,255,0.1); }
        .status-entregado { color: var(--accent-1-light); border-color: var(--accent-1-light); background: rgba(181,222,33,0.1); }

        .items-list { list-style: none; padding: 0; margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
        .item-row { font-size: 13px; color: var(--text-muted); margin-bottom: 5px; display: flex; justify-content: space-between; }
        
        .shipping-info { 
            font-size: 11px; background: rgba(0,0,0,0.2); padding: 10px; 
            margin-top: 15px; font-family: 'JetBrains Mono'; color: var(--text-muted);
        }

        .total-row { 
            margin-top: 15px; font-family: 'JetBrains Mono'; 
            font-weight: bold; color: var(--accent-1-light); text-align: right;
            font-size: 16px;
        }

        .empty-state { text-align: center; padding: 100px 0; font-family: 'JetBrains Mono'; opacity: 0.5; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Blue Moon HQ</a>
        <nav>
            <a href="index.html">INICIO</a>
            <a href="tienda.html">SUMINISTROS</a>
            <a href="mis-ordenes.html" class="active">MIS ÓRDENES</a>
            <a href="comunidad.html">RED</a>
        </nav>
    </header>

    <main class="main-content">
        <h1>Manifiesto de Órdenes</h1>
        <div id="ordersWrapper">
            <div class="empty-state">Sincronizando con el servidor central...</div>
        </div>
    </main>

    <script>
        auth.onAuthStateChanged(user => {
            if (user) {
        // El usuario está autenticado, cargamos sus datos
                currentUser = user;
                fetchOrders(user.uid);
            } else {
        // Agregamos un pequeño retraso o validamos que realmente no haya sesión
        // Antes de redirigir, verificamos si Firebase ya terminó de inicializar
                setTimeout(() => {
                    if (!auth.currentUser) {
                        console.warn("Acceso denegado: No se detectó sesión activa.");
                        window.location.href = "index.html";
                    }
                }, 1500); // Le damos 1.5 segundos para conectar
            }
        });

        function fetchOrders(uid) {
            const container = document.getElementById('ordersWrapper');
            
            db.collection("ordenes_cuartel")
                .where("agenteId", "==", uid)
                .orderBy("fecha", "desc")
                .onSnapshot(snapshot => {
                    if (snapshot.empty) {
                        container.innerHTML = '<div class="empty-state">> NO SE DETECTARON ACTIVOS EN TRÁNSITO.</div>';
                        return;
                    }

                    container.innerHTML = '';
                    snapshot.forEach(doc => {
                        const order = doc.data();
                        const date = order.fecha ? order.fecha.toDate().toLocaleDateString() : "PROCESANDO";
                        const statusClass = `status-${order.estado.toLowerCase().replace(/\s+/g, '-')}`;
                        
                        // Generar lista de productos
                        const itemsHtml = order.items.map(i => `
                            <div class="item-row">
                                <span>• ${i.name} [${i.type.toUpperCase()}]</span>
                                <span>${i.price} ◈</span>
                            </div>
                        `).join('');

                        // Info de envío (si existe)
                        let shippingHtml = '';
                        if (order.envio) {
                            shippingHtml = `
                                <div class="shipping-info">
                                    COORDENADAS DE ENTREGA:<br>
                                    ${order.envio.dir}, ${order.envio.ciudad}<br>
                                    ${order.envio.pais} CP:${order.envio.cp}
                                </div>
                            `;
                        }

                        container.innerHTML += `
                            <article class="order-card">
                                <div class="order-header">
                                    <div>
                                        <div class="order-id">ORDEN_REF: ${doc.id.substring(0,8).toUpperCase()}</div>
                                        <div style="font-size:12px; opacity:0.6; margin-top:4px;">FECHA_REG: ${date}</div>
                                    </div>
                                    <span class="status-pill ${statusClass}">${order.estado}</span>
                                </div>
                                <div class="items-list">${itemsHtml}</div>
                                ${shippingHtml}
                                <div class="total-row">CARGO TOTAL: ${order.total} ◈</div>
                            </article>
                        `;
                    });
                });
        }
    </script>
</body>
</html>
