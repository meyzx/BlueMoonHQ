<style>
    /* Estilos para el formulario de envío dentro del carrito */
    .shipping-form {
        background: rgba(0,0,0,0.3);
        padding: 15px;
        margin-top: 20px;
        border: 1px dashed var(--primary-light);
        display: none; /* Se activa por JS */
    }
    .shipping-form h4 { font-family: 'JetBrains Mono'; color: var(--accent-1-light); margin: 0 0 10px 0; font-size: 12px; }
    .shipping-form input {
        width: 100%; background: var(--bg-darkest); border: 1px solid var(--primary-dark);
        color: white; padding: 8px; margin-bottom: 10px; font-size: 12px; box-sizing: border-box;
    }
    .cart-item-detail { font-size: 10px; color: var(--accent-1-light); display: block; }
</style>

<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h2 style="font-family:'JetBrains Mono'; font-size:18px; margin:0;">LOGÍSTICA HQ</h2>
        <button onclick="toggleCart()" style="background:none; border:none; color:white; cursor:pointer; font-size: 20px;">✕</button>
    </div>
    
    <div class="cart-items" id="cartItems">
        </div>

    <div id="shippingArea" class="shipping-form">
        <h4 id="shippingTitle">DATOS DE TRANSMISIÓN</h4>
        <input type="text" id="shipName" placeholder="Nombre completo del Agente">
        <div id="physicalFields" style="display:none;">
            <input type="text" id="shipAddress" placeholder="Dirección de entrega (Calle, Num, Col)">
            <input type="text" id="shipCity" placeholder="Ciudad y Estado">
            <input type="text" id="shipZip" placeholder="Código Postal">
        </div>
        <input type="email" id="shipEmail" placeholder="Correo de contacto">
    </div>

    <div class="cart-total">
        <div style="display:flex; justify-content:space-between; margin-bottom: 10px;">
            <span>TOTAL:</span>
            <span id="cartTotal" style="font-weight:bold; color:var(--accent-1-light);">0 ◈</span>
        </div>
        <button class="checkout-btn" id="btnConfirmar" onclick="processOrder()">CONFIRMAR ORDEN</button>
    </div>
</div>

<script>
    let cart = JSON.parse(localStorage.getItem('hq_cart')) || [];
    let currentUser = null;

    // Detectar usuario de Firebase
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            db.collection("agentes").doc(user.uid).get().then(doc => {
                if(doc.exists) document.getElementById('shipName').value = doc.data().username;
            });
        }
    });

    function toggleCart() {
        document.getElementById('cartSidebar').classList.toggle('active');
        updateCart();
    }

    // Función para agregar productos con TIPO
    function addToCart(name, price, type) {
        cart.push({ name, price, type });
        updateCart();
        // Feedback visual
        const btn = event.target;
        const originalText = btn.innerText;
        btn.innerText = "¡AÑADIDO!";
        btn.style.borderColor = "white";
        setTimeout(() => { btn.innerText = originalText; btn.style.borderColor = "var(--accent-1-light)"; }, 1000);
    }

    function updateCart() {
        localStorage.setItem('hq_cart', JSON.stringify(cart));
        const cartItems = document.getElementById('cartItems');
        const cartCount = document.getElementById('cartCount');
        const cartTotal = document.getElementById('cartTotal');
        const shippingArea = document.getElementById('shippingArea');
        const physicalFields = document.getElementById('physicalFields');
        
        cartItems.innerHTML = '';
        let total = 0;
        let hasPhysical = false;

        if (cart.length > 0) {
            shippingArea.style.display = "block";
            cart.forEach((item, index) => {
                total += item.price;
                if(item.type === 'fisico') hasPhysical = true;
                
                cartItems.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <span style="display:block;">${item.name}</span>
                            <span class="cart-item-detail">[${item.type.toUpperCase()}]</span>
                        </div>
                        <div style="text-align:right">
                            <span>${item.price} ◈</span>
                            <button onclick="removeItem(${index})" style="background:none; border:none; color:#ff4b4b; cursor:pointer; display:block; margin-left:auto; font-size:10px;">ELIMINAR</button>
                        </div>
                    </div>
                `;
            });
            
            // Mostrar campos según tipo de producto
            physicalFields.style.display = hasPhysical ? "block" : "none";
            document.getElementById('shippingTitle').innerText = hasPhysical ? "DATOS DE ENVÍO FÍSICO" : "DATOS DE ENTREGA DIGITAL";
        } else {
            cartItems.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:12px; margin-top:20px;">Terminal de carga vacía.</p>';
            shippingArea.style.display = "none";
        }

        cartCount.innerText = cart.length;
        cartTotal.innerText = `${total} ◈`;
    }

    function removeItem(index) {
        cart.splice(index, 1);
        updateCart();
    }

    async function processOrder() {
        if (!currentUser) return alert("Debes iniciar sesión como Agente para procesar órdenes.");
        if (cart.length === 0) return;

        const btn = document.getElementById('btnConfirmar');
        const orderData = {
            agenteId: currentUser.uid,
            agenteNombre: document.getElementById('shipName').value,
            email: document.getElementById('shipEmail').value,
            productos: cart,
            total: cart.reduce((acc, item) => acc + item.price, 0),
            fecha: firebase.firestore.FieldValue.serverTimestamp(),
            estado: "Pendiente"
        };

        // Si hay productos físicos, agregar dirección
        const hasPhysical = cart.some(i => i.type === 'fisico');
        if (hasPhysical) {
            orderData.logistica = {
                direccion: document.getElementById('shipAddress').value,
                ciudad: document.getElementById('shipCity').value,
                zip: document.getElementById('shipZip').value
            };
            if (!orderData.logistica.direccion) return alert("Faltan datos de envío físico.");
        }

        if (!orderData.email) return alert("El correo de contacto es obligatorio.");

        btn.disabled = true;
        btn.innerText = "PROCESANDO...";

        try {
            await db.collection("ordenes_cuartel").add(orderData);
            alert(">> ORDEN REGISTRADA. Silas se pondrá en contacto pronto.");
            cart = [];
            updateCart();
            toggleCart();
        } catch (error) {
            console.error(error);
            alert("Error en la conexión con la base de datos.");
        } finally {
            btn.disabled = false;
            btn.innerText = "CONFIRMAR ORDEN";
        }
    }
</script>

<button class="buy-btn" onclick="addToCart('Hoodie Protocolo 4.0', 450, 'fisico')">AGREGAR</button>
<button class="buy-btn" onclick="addToCart('Sticker Pack Digital', 50, 'digital')">AGREGAR</button>
